name: Bun lockfile in sync

on:
  pull_request:
  push:
    branches: [main]

jobs:
  in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install from the canonical lockfile
        run: bun install --frozen-lockfile

      - name: Run the repository gate
        run: bun run check
